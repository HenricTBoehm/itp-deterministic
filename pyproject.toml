[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itp-deterministic"
version = "0.1.0"
description = "Reproducible mathematical and documentary audits of 2023 and 2026 building-energy research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
itp-opt = "itp_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
